name: Build and Push to ACR

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build Image
        run: |
          docker build \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/mywebsite:latest \
            .

      - name: Push Image
        run: |
          docker push \
            ${{ secrets.ACR_LOGIN_SERVER }}/mywebsite:latest